name: Build macOS .dmg

# 在 GitHub Actions 的 macos runner 上打包，彻底绕开本机 8GB 内存限制，
# 还能顺带做苹果公证（配置好 secrets 后取消注释签名/公证步骤）。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write   # 允许 softprops/action-gh-release 创建 Release
      issues: write     # 允许失败时把报错自动发到 Issue（便于无 token 调试）
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # 注意：pywebview 不含 [mac] extra，直接装即可（macOS 会自动拉 pyobjc）
          pip install "pywebview>=6.0" pyinstaller pyobjc
          python -c "import webview; print('webview', webview.__version__)"

      - name: Build .app (PyInstaller --onedir)
        run: |
          set -o pipefail
          python -m PyInstaller --name MyCodex --windowed --onedir \
            --osx-bundle-identifier com.mycodex.app \
            --icon macos/AppIcon.icns \
            --add-data "app:app" \
            --add-data "macos/AppIcon.icns:." \
            --hidden-import "webview.platforms.cocoa" \
            --hidden-import "webview.platforms" \
            --hidden-import "urllib.request" \
            --hidden-import "urllib.error" \
            --hidden-import "PIL" \
            macos/launcher.py 2>&1 | tee /tmp/pyinstaller.log

      - name: Debug on failure
        if: failure()
        run: |
          echo "=== pyinstaller.log ==="; cat /tmp/pyinstaller.log 2>/dev/null || true
          echo "=== dist ==="; ls -la dist/ 2>/dev/null || true

      - name: Surface error to issue (debugging)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const cp = require('child_process');
            let log = '';
            try { log = fs.readFileSync('/tmp/pyinstaller.log', 'utf8'); } catch (e) {}
            const dist = cp.execSync('ls -la dist/ 2>/dev/null || echo none').toString();
            const body = `## Build failed (run ${context.runNumber})\n\n` +
              `**pyinstaller.log (tail):**\n\`\`\`\n${log.slice(-4000)}\n\`\`\`\n\n` +
              `**dist/:**\n\`\`\`\n${dist}\n\`\`\``;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `CI build failed #${context.runNumber}`, body
            });

      - name: Create .dmg
        run: |
          hdiutil create -volname MyCodex -srcfolder dist/MyCodex.app -ov -format UDZO dist/MyCodex.dmg
          ls -la dist/MyCodex.dmg

      # 可选：苹果公证（消除"身份不明开发者"警告）。
      # 需在仓库 Settings -> Secrets 配置：
      #   MACOS_CERT_P12, CERT_PASSWORD, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
      # 并取消下面注释：
      # - name: Sign & Notarize
      #   env:
      #     MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      #     CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
      #     APPLE_ID: ${{ secrets.APPLE_ID }}
      #     APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      #     APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      #   run: |
      #     echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
      #     security import cert.p12 -k ~/Library/Keychains/login.keychain-db -P "$CERT_PASSWORD" -T /usr/bin/codesign
      #     codesign --deep --force --options runtime --sign "$APPLE_TEAM_ID" dist/MyCodex.app
      #     xcrun notarytool submit dist/MyCodex.dmg --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
      #     xcrun stapler staple dist/MyCodex.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyCodex-macOS
          path: dist/MyCodex.dmg

      # 自动发布到 GitHub Release（Actions 自带 GITHUB_TOKEN 即可，无需额外配置）。
      # 官网下载按钮可永久指向：
      #   https://github.com/liebangbang/MyCodex/releases/latest/download/MyCodex.dmg
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/MyCodex.dmg
          name: MyCodex ${{ github.ref_name }}
          body: |
            ## MyCodex ${{ github.ref_name }} (macOS)

            独立安装包（.dmg，双击即用，已内置 Python + pywebview）。

            **下载**：MyCodex.dmg
            **系统要求**：macOS 12+，Apple Silicon / Intel
            **运行方式**：下载后拖拽 MyCodex.app 到「应用程序」即可。

            > 未做苹果公证，首次打开若提示"身份不明开发者"，右键 → 打开 即可。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
