<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>MyCodex</title>
  <link rel="stylesheet" href="style.css?v=12" />
</head>
<body>
  <div class="app">
    <!-- 顶栏 -->
    <header class="topbar">
      <div class="brand">
        <img class="logo" src="{{APP_ICON}}" alt="MyCodex" />
        <span class="brand-name">MyCodex</span>
      </div>
      <div class="task-title" id="taskTitle">未命名任务</div>
      <div class="top-actions">
        <button class="icon-btn big" id="btnTheme" title="切换主题">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="btn ghost" id="btnDir" title="选择工作目录">
          <svg class="icon" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          目录
        </button>
        <button class="btn primary" id="btnNew">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          新建
        </button>
      </div>
    </header>

    <div class="body">
      <!-- 左：任务列表 -->
      <aside class="tasks" id="tasks">
        <div class="pane-head">
          <span>任务</span>
          <div class="pane-actions">
            <button class="icon-btn" id="btnCollapseTasks" title="折叠任务栏">
              <svg class="icon" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <button class="icon-btn" id="btnAddTask" title="新建任务">
              <svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>
        </div>
        <div class="task-search">
          <svg class="icon search-ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="taskSearch" class="search-input" type="text" placeholder="搜索任务…" />
          <button class="search-clear" id="taskSearchClear" title="清空" style="display:none">×</button>
        </div>
        <div class="task-list" id="taskList"></div>
        <button class="rail-expand" id="btnExpandTasks" title="展开任务栏">
          <svg class="icon" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
          <span class="rail-label">任务</span>
        </button>
      </aside>

      <div class="splitter" id="splitLeft" title="拖拽调整宽度"></div>

      <!-- 中：对话框 -->
      <main class="center">
        <div class="center-head">
          <span class="center-title" id="centerTitle">对话框</span>
          <span class="status" id="statusText"></span>
        </div>
        <div class="messages" id="messages"></div>
        <!-- 空态引导（无消息时显示） -->
        <div class="empty-state" id="emptyState">
          <div class="empty-logo">
            <img src="{{APP_ICON}}" alt="MyCodex" />
          </div>
          <div class="empty-title">开始新的编码任务</div>
          <div class="empty-sub">直接输入指令，或点下面的快捷操作试试</div>
          <div class="empty-chips">
            <button class="chip" data-prompt="审查当前工作目录项目的代码质量，给出改进建议">审查代码</button>
            <button class="chip" data-prompt="总结这个项目的结构和功能">项目概览</button>
            <button class="chip" data-prompt="帮我排查当前项目里的问题">排查问题</button>
          </div>
        </div>
        <div class="composer">
          <div class="composer-bar">
            <select id="modelSel" class="select" title="模型">
              <option value="deepseek-v4-flash">深度·Flash</option>
              <option value="deepseek-v4-pro">深度·Pro</option>
              <option value="qwen3.8-max">通义·3.8 Max</option>
              <option value="qwen3.7-flash">通义·3.7 Flash</option>
              <option value="qwen-plus">通义·Plus</option>
            </select>
            <select id="thinkSel" class="select" title="思考模式">
              <option value="off">思考 关</option>
              <option value="auto">思考 自动</option>
              <option value="on">思考 开</option>
            </select>
            <button class="icon-btn" id="btnImg" title="添加文件 / 图片 / PDF（AI 可理解内容）">
              <svg class="icon" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M9 13h6M9 16.5h4"/></svg>
            </button>
          </div>
          <div class="composer-input">
            <textarea id="input" rows="1" placeholder="输入任务指令…  (Enter 换行 · ⌘/Ctrl+Enter 发送 · 可粘贴/拖拽图片)"></textarea>
            <div class="composer-btns">
              <button class="btn stop" id="btnStop" style="display:none">停止</button>
              <button class="btn primary" id="btnSend" title="发送 (⌘/Ctrl+Enter)">发送</button>
            </div>
          </div>
          <div class="img-preview" id="imgPreview" style="display:none">
            <div class="img-thumbs" id="imgThumbs"></div>
            <div class="img-actions">
              <span class="img-hint" id="imgHint"></span>
              <button class="btn ghost small" id="btnOcr" title="提取图片中的文字到输入框">识别文字</button>
              <button class="btn ghost small" id="btnImgCancel" title="移除全部附件">移除</button>
            </div>
          </div>
          <input type="file" id="fileImg" accept=".pdf,.png,.jpg,.jpeg,.gif,.webp,.bmp,.svg,.ico,.heic" multiple style="display:none" />
        </div>
      </main>

      <div class="splitter" id="splitRight" title="拖拽调整宽度"></div>

      <!-- 右：产物 -->
      <aside class="artifacts" id="artifacts">
        <div class="pane-head">
          <span>产物</span>
          <div class="pane-actions">
            <span class="count" id="artCount">0</span>
            <button class="icon-btn" id="btnCollapseArtifacts" title="折叠产物栏">
              <svg class="icon" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
            </button>
          </div>
        </div>
        <div class="preview" id="preview">
          <div class="preview-empty">
            <svg class="icon" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>
            点击产物查看内容
          </div>
        </div>
        <div class="art-list" id="artList"></div>
        <button class="rail-expand" id="btnExpandArtifacts" title="展开产物栏">
          <svg class="icon" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
          <span class="rail-label">产物</span>
        </button>
      </aside>
    </div>
  </div>

  <!-- 确认弹窗（危险命令） -->
  <div class="modal-mask" id="modalMask" style="display:none">
    <div class="modal">
      <div class="modal-title">确认执行命令</div>
      <pre class="modal-cmd" id="modalCmd"></pre>
      <div class="modal-actions">
        <button class="btn ghost" id="modalCancel">取消</button>
        <button class="btn danger" id="modalOk">允许执行</button>
      </div>
    </div>
  </div>

  <script>window.__APP_ICON__ = "{{APP_ICON}}";</script>
  <script src="app.js?v=12"></script>
</body>
</html>
