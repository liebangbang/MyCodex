# MyCodex 产品官网 · 阶段一（HTTP 直 serve，待 DNS 生效后由 certbot 升级为 HTTPS）
# 部署后需用户在阿里云 DNS 给 mycodex.me / www.mycodex.me 加 A 记录指向本机公网 IP
server {
    listen 80;
    listen [::]:80;
    server_name mycodex.me www.mycodex.me;

    root /var/www/mycodex;
    index index.html;
    charset utf-8;

    # certbot 签发校验目录（升级 HTTPS 时用）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 静态资源长缓存
    location ~* \.(?:css|js|jpg|jpeg|png|gif|webp|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # SPA 式兜底：未匹配路径回退首页
    location / {
        try_files $uri $uri/ /index.html;
    }
}
